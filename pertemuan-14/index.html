<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Mahasiswa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📋 Data Mahasiswa</h1>
        
        <div class="form-card">
            <h2>Tambah / Update Mahasiswa</h2>
            
            <div class="form-group">
                <label for="nim">NIM:</label>
                <input type="text" id="nim" placeholder="Masukkan NIM">
            </div>
            
            <div class="form-group">
                <label for="nama">Nama:</label>
                <input type="text" id="nama" placeholder="Masukkan Nama">
            </div>
            
            <div class="form-group">
                <label for="jurusan">Jurusan:</label>
                <select id="jurusan">
                    <option value="">Pilih Jurusan</option>
                    <option value="Sistem Informasi">Sistem Informasi</option>
                    <option value="Informatika">Informatika</option>
                    <option value="Teknik Komputer">Teknik Komputer</option>
                    <option value="Manajemen Informatika">Manajemen Informatika</option>
                    <option value="Akuntansi">Akuntansi</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="fakultas">Fakultas:</label>
                <select id="fakultas">
                    <option value="">Pilih Fakultas</option>
                    <option value="Teknik">Teknik</option>
                    <option value="Ilmu Komputer">Ilmu Komputer</option>
                    <option value="Ekonomi">Ekonomi</option>
                    <option value="Hukum">Hukum</option>
                </select>
            </div>
            
            <div class="button-group">
                <button id="btnTambah" class="btn-tambah">➕ Tambah Mahasiswa</button>
                <button id="btnUpdate" class="btn-update" style="display:none;">✏️ Update Data Mahasiswa</button>
                <button id="btnBatal" class="btn-batal" style="display:none;">❌ Batal</button>
            </div>
        </div>
        
        <div class="table-card">
            <h2>📊 Daftar Mahasiswa</h2>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Cari berdasarkan NIM atau Nama...">
            </div>
            <div class="table-wrapper">
                <table id="tabelMahasiswa">
                    <thead>
                        <tr>
                            <th>NIM</th>
                            <th>Nama</th>
                            <th>Jurusan</th>
                            <th>Fakultas</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyMahasiswa">
                        <tr>
                            <td colspan="5" style="text-align: center;">Belum ada data</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="info-data">
                <span id="jumlahData">Total: 0 Mahasiswa</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
